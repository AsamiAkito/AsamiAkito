name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#d0643a&color_dots=#f3ece8,#ffd9c2,#ffb07c,#ff8a4c,#e2574c
            dist/snake-dark.svg?color_snake=#ffb07c&color_dots=#161b22,#4a2a26,#8c3f2c,#d9643a,#ffb07c&color_background=#00000000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
