<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf6"/><stop offset="1" stop-color="#fdf0f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb07c"/><stop offset="0.5" stop-color="#f6a6b2"/><stop offset="1" stop-color="#b39ddb"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .orb { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .o2 { animation-duration: 18s; animation-delay: -6s; }
      .o3 { animation-duration: 22s; animation-delay: -11s; }
      @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(60px,-30px) scale(1.15); } }
      .fade { opacity: 0; animation: in 1.2s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .75s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .bar { animation: grow 1.4s .6s cubic-bezier(.2,.8,.2,1) forwards; transform: scaleX(0); transform-origin: 600px 0; }
      @keyframes grow { to { transform: scaleX(1); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.35">
      <circle class="orb" cx="230" cy="90" r="140" fill="#ffb07c"/>
      <circle class="orb o2" cx="960" cy="250" r="160" fill="#b39ddb"/>
      <circle class="orb o3" cx="640" cy="40" r="110" fill="#f6a6b2"/>
    </g>
    <g fill="#6e7781" opacity="0.35">
      <circle cx="40" cy="24" r="1.2"/><circle cx="40" cy="316" r="1.2"/><circle cx="80" cy="24" r="1.2"/><circle cx="80" cy="316" r="1.2"/><circle cx="120" cy="24" r="1.2"/><circle cx="120" cy="316" r="1.2"/><circle cx="160" cy="24" r="1.2"/><circle cx="160" cy="316" r="1.2"/><circle cx="200" cy="24" r="1.2"/><circle cx="200" cy="316" r="1.2"/><circle cx="240" cy="24" r="1.2"/><circle cx="240" cy="316" r="1.2"/><circle cx="280" cy="24" r="1.2"/><circle cx="280" cy="316" r="1.2"/><circle cx="320" cy="24" r="1.2"/><circle cx="320" cy="316" r="1.2"/><circle cx="360" cy="24" r="1.2"/><circle cx="360" cy="316" r="1.2"/><circle cx="400" cy="24" r="1.2"/><circle cx="400" cy="316" r="1.2"/><circle cx="440" cy="24" r="1.2"/><circle cx="440" cy="316" r="1.2"/><circle cx="480" cy="24" r="1.2"/><circle cx="480" cy="316" r="1.2"/><circle cx="520" cy="24" r="1.2"/><circle cx="520" cy="316" r="1.2"/><circle cx="560" cy="24" r="1.2"/><circle cx="560" cy="316" r="1.2"/><circle cx="600" cy="24" r="1.2"/><circle cx="600" cy="316" r="1.2"/><circle cx="640" cy="24" r="1.2"/><circle cx="640" cy="316" r="1.2"/><circle cx="680" cy="24" r="1.2"/><circle cx="680" cy="316" r="1.2"/><circle cx="720" cy="24" r="1.2"/><circle cx="720" cy="316" r="1.2"/><circle cx="760" cy="24" r="1.2"/><circle cx="760" cy="316" r="1.2"/><circle cx="800" cy="24" r="1.2"/><circle cx="800" cy="316" r="1.2"/><circle cx="840" cy="24" r="1.2"/><circle cx="840" cy="316" r="1.2"/><circle cx="880" cy="24" r="1.2"/><circle cx="880" cy="316" r="1.2"/><circle cx="920" cy="24" r="1.2"/><circle cx="920" cy="316" r="1.2"/><circle cx="960" cy="24" r="1.2"/><circle cx="960" cy="316" r="1.2"/><circle cx="1000" cy="24" r="1.2"/><circle cx="1000" cy="316" r="1.2"/><circle cx="1040" cy="24" r="1.2"/><circle cx="1040" cy="316" r="1.2"/><circle cx="1080" cy="24" r="1.2"/><circle cx="1080" cy="316" r="1.2"/><circle cx="1120" cy="24" r="1.2"/><circle cx="1120" cy="316" r="1.2"/><circle cx="1160" cy="24" r="1.2"/><circle cx="1160" cy="316" r="1.2"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#eaddd7"/>
  <g text-anchor="middle">
    <text class="fade d1" x="600" y="98" fill="#6e7781" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" letter-spacing="6">HELLO · こんにちは · 你好</text>
    <text class="fade d2" x="600" y="190" fill="#1f2328" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP','Songti SC',serif" font-size="76" font-weight="600" letter-spacing="18">浅見秋渡</text>
    <rect class="bar" x="520" y="214" width="160" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="fade d3" x="600" y="258" fill="#e0794a" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="500" letter-spacing="10">ASAMI AKITO</text>
  </g>
  <text class="fade d3" x="1160" y="304" text-anchor="end" fill="#6e7781" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13">~/asamiakito <tspan class="blink">▍</tspan></text>
</svg>
